name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Validate analytics endpoint
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          config = Path('analytics/config.js').read_text()
          match = re.search(r"endpoint:\s*['\"]([^'\"]+)['\"]", config)
          endpoint = match.group(1) if match else ''
          parsed = urlparse(endpoint)
          if (parsed.scheme != 'https' or parsed.netloc != 'script.google.com'
                  or not re.fullmatch(r'/macros/s/[^/]+/exec', parsed.path)):
              raise SystemExit('analytics/config.js needs a valid Google Apps Script web app /exec URL.')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
