<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Field Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>

    <style>
        body { padding-top: calc(var(--nav-height) + 2rem); }

        .admin-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* ── Tabs ── */
        .admin-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .admin-tab {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            padding: 0.45rem 1.1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--muted);
            cursor: pointer;
            text-transform: lowercase;
            letter-spacing: 0.02em;
            transition: color 0.2s, border-color 0.2s;
        }

        .admin-tab:hover { color: var(--text); }

        .admin-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        /* ── Edit loader ── */
        #edit-loader { margin-bottom: 0.5rem; }

        .load-row {
            display: flex;
            gap: 0.7rem;
            align-items: flex-end;
        }

        .load-row .field { flex: 1; margin-bottom: 0; }

        .load-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--accent);
            font-family: monospace;
            font-size: 0.82rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s, border-color 0.2s;
            height: fit-content;
        }

        .load-btn:hover { background: var(--accent-bg); border-color: var(--accent-light); }
        .load-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── Form fields ── */
        .field { margin-bottom: 1.4rem; }

        .field label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .field input[type="text"],
        .field input[type="date"],
        .field textarea {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .field input:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--accent-light);
        }

        .field input[readonly] {
            opacity: 0.6;
            background: var(--bg);
            cursor: not-allowed;
        }

        .field textarea {
            min-height: 280px;
            resize: vertical;
            font-family: monospace;
            font-size: 0.88rem;
            line-height: 1.6;
        }

        .tag-checkboxes {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag-checkboxes label {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.82rem;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            color: var(--text);
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.25rem 0.7rem;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .tag-checkboxes label:has(input:checked) {
            background: var(--accent-bg);
            border-color: var(--accent-light);
            color: var(--accent);
        }

        .tag-checkboxes input[type="checkbox"] { display: none; }

        /* ── Submit button ── */
        .submit-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 2rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .submit-btn:hover { background: var(--accent-hover); }
        .submit-btn:disabled { opacity: 0.65; cursor: not-allowed; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .submit-btn .spinner {
            display: none;
            width: 0.9em;
            height: 0.9em;
            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            flex-shrink: 0;
        }

        .submit-btn.loading .spinner { display: inline-block; }

        /* ── Status messages ── */
        .status-msg {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.92rem;
            display: none;
        }

        .status-msg.success {
            background: #eefaf0;
            border: 1px solid #a8ddb5;
            color: #2d6a4f;
            display: block;
        }

        .status-msg.error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            display: block;
        }

        .status-msg a { color: inherit; text-decoration: underline; }

        /* ── Hints ── */
        .slug-hint {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 0.3rem;
            font-family: monospace;
        }

        .body-note {
            font-size: 0.78rem;
            color: #b45309;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            margin-top: 0.4rem;
            font-family: monospace;
            display: none;
        }

        /* ── PAT controls ── */
        .pat-controls { margin-top: 1rem; }

        .pat-reset-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.78rem;
            font-family: monospace;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
        }

        .pat-reset-btn:hover { color: var(--accent); }
    </style>
</head>

<body>

    <nav id="nav" class="scrolled">
        <a class="nav-mark" href="/"><span class="dot"></span></a>
        <button id="burger-icon" aria-label="Toggle menu"
            onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
        <div id="nav-links">
            <a href="/#about">about</a>
            <a href="/#research">research</a>
            <a href="/#experience">experience</a>
            <a href="/#education">education</a>
            <a href="/#studyguides">study guides</a>
            <a href="/#beyond">beyond</a>
            <a href="/" target="_blank" rel="noopener">cv</a>
            <span class="nav-pipe">|</span>
            <a href="/fieldnotes/" class="field-notes">field notes</a>
        </div>
    </nav>

    <div class="admin-container">

        <!-- Tabs -->
        <div class="admin-tabs">
            <button class="admin-tab active" id="tab-new" onclick="switchTab('new')">new post</button>
            <button class="admin-tab" id="tab-edit" onclick="switchTab('edit')">edit post</button>
        </div>

        <!-- Edit-mode slug loader (only visible in edit tab before post is loaded) -->
        <div id="edit-loader" style="display:none;">
            <div class="load-row">
                <div class="field">
                    <label for="edit-slug-input">Slug</label>
                    <input type="text" id="edit-slug-input" placeholder="post-slug-to-edit" />
                </div>
                <button class="load-btn" id="load-btn" onclick="loadPost()">Load Post</button>
            </div>
            <div class="status-msg" id="load-status"></div>
        </div>

        <!-- Main form (shared by both modes) -->
        <form id="post-form">
            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required placeholder="Post title" />
            </div>

            <div class="field">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required />
            </div>

            <div class="field">
                <label for="slug">Slug</label>
                <input type="text" id="slug" name="slug" required placeholder="url-friendly-slug" />
                <p class="slug-hint">→ /fieldnotes/posts/<span id="slug-preview">...</span>.html</p>
            </div>

            <div class="field">
                <label for="summary">Summary</label>
                <input type="text" id="summary" name="summary" required placeholder="One-sentence description" />
            </div>

            <div class="field">
                <label for="tags">Tags</label>
                <input type="text" id="tags" name="tags" placeholder="research, bluesky, personal..." />
                <p class="slug-hint">comma-separated</p>
            </div>

            <div class="field">
                <label for="body">Body (Markdown)</label>
                <textarea id="body" name="body" placeholder="Write your post in Markdown..."></textarea>
                <p class="body-note" id="body-note">⚠ Loaded as rendered HTML — will be re-rendered from this content on save.</p>
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <span class="spinner"></span>
                <span id="submit-label">Publish</span>
            </button>
            <div class="status-msg" id="status"></div>
        </form>

        <div class="pat-controls">
            <button class="pat-reset-btn" onclick="resetPAT()">reset GitHub token</button>
        </div>
    </div>

    <script>
        const OWNER      = 'simaadleyba';
        const REPO       = 'simaadleyba.github.io';
        const POSTS_PATH = 'fieldnotes/posts.json';

        // ── Password gate ──
        const PASSWORD = 'tasbak-5tydhy-carBih';
        (function checkPassword() {
            const stored = sessionStorage.getItem('admin_auth');
            if (stored === PASSWORD) return;
            const entered = window.prompt('Password:');
            if (entered !== PASSWORD) {
                window.location.href = '/';
            } else {
                sessionStorage.setItem('admin_auth', PASSWORD);
            }
        })();

        // ── GitHub PAT ──
        function getPAT() { return localStorage.getItem('gh_pat'); }

        function promptPAT() {
            const pat = window.prompt('Enter your GitHub Personal Access Token\n(needs repo / contents:write scope):');
            if (!pat) { window.location.href = '/'; return null; }
            localStorage.setItem('gh_pat', pat);
            return pat;
        }

        function resetPAT() {
            localStorage.removeItem('gh_pat');
            alert('Token cleared. Reload to enter a new one.');
        }

        if (!getPAT()) promptPAT();

        // ── Mode state ──
        let currentMode = 'new';

        function switchTab(mode) {
            currentMode = mode;
            document.getElementById('tab-new').classList.toggle('active', mode === 'new');
            document.getElementById('tab-edit').classList.toggle('active', mode === 'edit');

            clearStatus('status');
            clearStatus('load-status');

            if (mode === 'new') {
                document.getElementById('edit-loader').style.display = 'none';
                document.getElementById('post-form').style.display = 'block';
                document.getElementById('slug').readOnly = false;
                document.getElementById('body-note').style.display = 'none';
                document.getElementById('submit-label').textContent = 'Publish';
                resetForm();
            } else {
                document.getElementById('edit-loader').style.display = 'block';
                document.getElementById('post-form').style.display = 'none';
                document.getElementById('edit-slug-input').value = '';
                document.getElementById('edit-slug-input').focus();
            }
        }

        // ── Load post for editing ──
        async function loadPost() {
            const slug = document.getElementById('edit-slug-input').value.trim();
            if (!slug) return;

            const loadBtn = document.getElementById('load-btn');
            loadBtn.disabled = true;
            loadBtn.textContent = 'Loading…';
            clearStatus('load-status');

            const pat = getPAT();
            try {
                // 1. Fetch posts.json, find entry
                const postsFile = await ghFetch(POSTS_PATH, 'GET', null, pat);
                const posts = JSON.parse(atob(postsFile.content.replace(/\n/g, '')));
                const post = posts.find(p => p.slug === slug);
                if (!post) throw new Error(`No post found with slug "${slug}"`);

                // 2. Fetch post HTML, extract .post-body
                const postFile = await ghFetch(`fieldnotes/posts/${slug}.html`, 'GET', null, pat);
                const rawHtml = atob(postFile.content.replace(/\n/g, ''));
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawHtml, 'text/html');
                const postBodyEl = doc.querySelector('.post-body');
                const bodyContent = postBodyEl ? postBodyEl.innerHTML.trim() : '';

                // 3. Pre-fill form fields
                document.getElementById('title').value   = post.title   || '';
                document.getElementById('date').value    = post.date    || '';
                document.getElementById('slug').value    = post.slug    || '';
                document.getElementById('slug-preview').textContent = post.slug || '...';
                document.getElementById('summary').value = post.summary || '';
                document.getElementById('tags').value    = (post.tags || []).join(', ');
                document.getElementById('body').value    = bodyContent;

                // 4. Lock slug, show body note, update button
                document.getElementById('slug').readOnly = true;
                document.getElementById('body-note').style.display = 'block';
                document.getElementById('submit-label').textContent = 'Save Changes';

                // 5. Show form
                document.getElementById('post-form').style.display = 'block';

            } catch (err) {
                showStatus('load-status', 'error', 'Error: ' + err.message);
            }

            loadBtn.disabled = false;
            loadBtn.textContent = 'Load Post';
        }

        // Allow pressing Enter in the slug input to trigger load
        document.getElementById('edit-slug-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { e.preventDefault(); loadPost(); }
        });

        // ── Date default ──
        document.getElementById('date').value = new Date().toISOString().slice(0, 10);

        // ── Slug auto-generation (new mode only) ──
        document.getElementById('title').addEventListener('input', function () {
            if (currentMode === 'edit') return;
            const slug = toSlug(this.value);
            document.getElementById('slug').value = slug;
            document.getElementById('slug-preview').textContent = slug || '...';
        });

        document.getElementById('slug').addEventListener('input', function () {
            document.getElementById('slug-preview').textContent = this.value || '...';
        });

        function toSlug(str) {
            return str.toLowerCase().trim()
                .replace(/[^\w\s-]/g, '')
                .replace(/\s+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-+|-+$/g, '');
        }

        // ── Form submit ──
        document.getElementById('post-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const isEdit  = currentMode === 'edit';
            const btn     = document.getElementById('submit-btn');
            const label   = document.getElementById('submit-label');

            btn.disabled = true;
            btn.classList.add('loading');
            label.textContent = isEdit ? 'Saving…' : 'Publishing…';
            clearStatus('status');

            const pat = getPAT();
            if (!pat) { promptPAT(); btn.disabled = false; btn.classList.remove('loading'); label.textContent = isEdit ? 'Save Changes' : 'Publish'; return; }

            const title   = document.getElementById('title').value.trim();
            const date    = document.getElementById('date').value;
            const slug    = document.getElementById('slug').value.trim();
            const summary = document.getElementById('summary').value.trim();
            const tags    = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
            const body    = document.getElementById('body').value;
            const today   = new Date().toISOString().slice(0, 10);

            const post = isEdit
                ? { title, date, slug, summary, tags, lastEdited: today }
                : { title, date, slug, summary, tags };

            try {
                if (isEdit) {
                    await updatePostInJson(post, pat);
                } else {
                    await addPostToJson(post, pat);
                }

                const postHtml = buildPostHtml(post, marked.parse(body));
                await createFile(
                    `fieldnotes/posts/${slug}.html`,
                    postHtml,
                    `${isEdit ? 'Edit' : 'Add'} post: ${title}`,
                    pat
                );

                showStatus('status', 'success',
                    `${isEdit ? 'Updated!' : 'Published!'} <a href="/fieldnotes/posts/${slug}.html" target="_blank">/fieldnotes/posts/${slug}.html</a>`
                );

                if (!isEdit) resetForm();
            } catch (err) {
                showStatus('status', 'error', 'Error: ' + err.message);
            }

            btn.disabled = false;
            btn.classList.remove('loading');
            label.textContent = isEdit ? 'Save Changes' : 'Publish';
        });

        // ── GitHub API helpers ──
        async function ghFetch(path, method, body, pat) {
            const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
                method,
                headers: {
                    'Authorization': `Bearer ${pat}`,
                    'Content-Type': 'application/json',
                    'Accept': 'application/vnd.github+json',
                },
                body: body ? JSON.stringify(body) : undefined,
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || `GitHub API error ${res.status}`);
            }
            return res.json();
        }

        async function addPostToJson(newPost, pat) {
            const current = await ghFetch(POSTS_PATH, 'GET', null, pat);
            const posts = JSON.parse(atob(current.content.replace(/\n/g, '')));
            posts.unshift(newPost);
            await ghFetch(POSTS_PATH, 'PUT', {
                message: `Add post: ${newPost.title}`,
                content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2) + '\n'))),
                sha: current.sha,
            }, pat);
        }

        async function updatePostInJson(updatedPost, pat) {
            const current = await ghFetch(POSTS_PATH, 'GET', null, pat);
            const posts = JSON.parse(atob(current.content.replace(/\n/g, '')));
            const idx = posts.findIndex(p => p.slug === updatedPost.slug);
            if (idx === -1) throw new Error(`Post "${updatedPost.slug}" not found in posts.json`);
            posts[idx] = updatedPost;
            await ghFetch(POSTS_PATH, 'PUT', {
                message: `Edit post: ${updatedPost.title}`,
                content: btoa(unescape(encodeURIComponent(JSON.stringify(posts, null, 2) + '\n'))),
                sha: current.sha,
            }, pat);
        }
        async function createFile(path, content, message, pat) {
            let sha;
            try {
                const existing = await ghFetch(path, 'GET', null, pat);
                sha = existing.sha;
            } catch (_) { sha = undefined; }
            const body = { message, content: btoa(unescape(encodeURIComponent(content))) };
            if (sha) body.sha = sha;
            await ghFetch(path, 'PUT', body, pat);
        }

        // ── Post HTML template ──
        function buildPostHtml(post, bodyHtml) {
            const tagSpans = (post.tags || [])
                .map(t => `<span class="post-tag">${esc(t)}</span>`)
                .join('');

            const lastEditedBlock = post.lastEdited
                ? `\n    <div class="post-last-edited">Last edited: ${esc(fmtDate(post.lastEdited))}</div>`
                : '';

            return `<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${esc(post.title)} — Sima Adleyba</title>
    <meta name="description" content="${esc(post.summary)}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css?v=2" />
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .post-back {
            font-family: var(--ff-mono);
            font-size: 0.85rem;
            color: rgba(255,255,255,0.78);
            display: inline-block;
            margin-bottom: 1rem;
            border-bottom: 1px solid transparent;
        }

        .post-back:hover {
            color: #fff;
            border-bottom-color: #fff;
        }

        .post-body {
            max-width: 65ch;
            margin: 0 auto !important;
            padding: 2.2rem 0 1rem;
        }

        .post-body h1, .post-body h2, .post-body h3 { margin-top: 1.8rem; margin-bottom: 0.5rem; }
        .post-body p { margin-bottom: 1rem; }
        .post-body a { color: var(--steel); border-bottom: 1px solid var(--line-2); }
        .post-body a:hover { color: var(--ink-3); border-color: var(--ink-3); }
        .post-body code { background: var(--paper-2); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.87em; font-family: var(--ff-mono); }
        .post-body pre { background: var(--paper-2); padding: 1rem; border-radius: 8px; overflow-x: auto; margin-bottom: 1rem; }
        .post-body pre code { background: none; padding: 0; font-size: 0.85em; }
        .post-body blockquote { border-left: 3px solid var(--paper-3); margin: 0 0 1rem; padding: 0.3rem 1rem; color: var(--mute-2); }
        .post-body img { max-width: 100%; border-radius: 8px; margin: 0.5rem 0; }
        .post-body ul, .post-body ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .post-body li { margin-bottom: 0.3rem; }
        .post-body hr { border: none; border-top: 1px solid var(--line); margin: 2rem 0; }

        .post-last-edited {
            max-width: 65ch;
            margin: 0 auto !important;
            font-family: var(--ff-mono);
            font-size: 0.76rem;
            color: var(--mute-2);

        }

        @media (max-width: 768px) {
            section.section {

            }
            .post-last-edited {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
        }

        footer.footer {
            margin-top: auto;
        }
    </style>
</head>

        <div id="nav-links">
            <a href="/#about">about</a>

            <a href="/#experience">experience</a>
            <a href="/#education">education</a>
            <a href="/#studyguides">study guides</a>
            <a href="/#beyond">beyond</a>

            <span class="nav-pipe">|</span>
            <a href="/fieldnotes/" class="field-notes">field notes</a>
        </div>
    </nav>

    <!-- ========== HEADER STRIP ========== -->
    <header class="header-strip">
        <div class="header-strip__inner" style="display: block;">

            <h1 style="font-family: var(--ff-display); font-weight: 700; font-size: clamp(1.75rem, 3vw, 2.5rem); line-height: 1.1; margin: 0 0 0.8rem; color: #fff; text-transform: lowercase;">${esc(post.title)}</h1>

    <script>
        // Nav scrolled state
        const nav = document.getElementById('nav');
        const onScroll = () => {
            if (window.scrollY > 60) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        document.querySelectorAll('#nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('nav-links').classList.remove('open');
            });
        });

</body>
</html>`;
        }

        // ── Utilities ──
        function esc(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function fmtDate(iso) {
            if (!iso) return '';
            const d = new Date(iso + 'T00:00:00');
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function showStatus(id, type, html) {
            const el = document.getElementById(id);
            el.className = 'status-msg ' + type;
            el.innerHTML = html;
        }

        function clearStatus(id) {
            const el = document.getElementById(id);
            el.className = 'status-msg';
            el.innerHTML = '';
        }

        function resetForm() {
            document.getElementById('post-form').reset();
            document.getElementById('date').value = new Date().toISOString().slice(0, 10);
            document.getElementById('slug-preview').textContent = '...';
            document.getElementById('slug').readOnly = false;
            document.getElementById('body-note').style.display = 'none';
            document.getElementById('submit-label').textContent = 'Publish';
            clearStatus('status');
        }

        // Close mobile nav on link click
        document.querySelectorAll('#nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('nav-links').classList.remove('open');
            });
        });
    </script>

</body>
</html>
