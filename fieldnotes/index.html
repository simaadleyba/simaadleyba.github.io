<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field Notes — Sima Adleyba</title>
    <meta name="description" content="Field Notes — uncompressed thinking. Sima Adleyba's blog on grad school, life, research, and other things." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <meta name="apple-mobile-web-app-title" content="Sima Adleyba">

    <link rel="stylesheet" href="../style.css?v=2" />
    <link rel="icon" type="image/png" href="../assets/icon.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
</head>

<body>

    <!-- ========== NAV ========== -->
    <nav id="nav">
        <a class="nav-mark" href="/"><span class="dot"></span></a>
        <button id="burger-icon" aria-label="Toggle menu"
            onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
        <div id="nav-links">
            <a href="/#about">about</a>
            <a href="/#research">research</a>
            <a href="/#experience">experience</a>
            <a href="/#education">education</a>
            <a href="/#studyguides">study guides</a>
            <a href="/#beyond">beyond</a>
            <a href="/" target="_blank" rel="noopener">cv</a>
            <span class="nav-pipe">|</span>
            <a href="/fieldnotes/" class="field-notes">field notes</a>
        </div>
    </nav>

    <!-- ========== HEADER STRIP ========== -->
    <header class="header-strip">
        <div class="header-strip__inner">
            <div class="strip-title">
                <h1>Field Notes</h1>
                <span class="kicker">uncompressed thinking</span>
            </div>
            <div class="filters" id="filters" role="tablist">
                <!-- Dynamically generated by JS -->
            </div>
        </div>
    </header>

    <!-- ========== POSTS ========== -->
    <main>
        <div class="posts" id="posts">
            <!-- Dynamically generated by JS -->
        </div>
        <div class="empty-state" id="empty" style="display:none;">— no posts in this tag yet —</div>
    </main>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
        <div class="footer-bg" aria-hidden="true"></div>
        <div class="footer-inner">
            <div class="footer-left">
                <p class="footer-email">adleyba [at] sabanciuniv [dot] edu</p>
            </div>
            <p class="footer-copy">© 2026 — SIMA ADLEYBA</p>
        </div>
    </footer>

    <!-- Analytics -->
    <script src="../analytics/config.js"></script>
    <script src="../analytics/tracker.js"></script>

    <script>
        // Nav scrolled state
        const nav = document.getElementById('nav');
        const onScroll = () => {
            if (window.scrollY > 60) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // Close mobile nav when clicking a link
        document.querySelectorAll('#nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('nav-links').classList.remove('open');
            });
        });

        let allPosts = [];
        let activeTag = null;

        async function loadPosts() {
            try {
                const res = await fetch('/fieldnotes/posts.json');
                allPosts = await res.json();
            } catch (e) {
                allPosts = [];
            }
            renderPosts();
            renderTagFilter();
        }

        function renderTagFilter() {
            const container = document.getElementById('filters');
            const tags = [...new Set(allPosts.flatMap(p => p.tags || []))].sort();
            if (tags.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'flex';

            // Calculate counts
            const counts = { all: allPosts.length };
            allPosts.forEach(p => {
                (p.tags || []).forEach(t => {
                    counts[t] = (counts[t] || 0) + 1;
                });
            });

            const allActive = !activeTag;
            let html = `<button class="filter-btn${allActive ? ' active' : ''}" onclick="filterTag(null)" role="tab">all <span class="count">${counts.all}</span></button>`;

            tags.forEach(t => {
                const isActive = activeTag === t;
                html += `<button class="filter-btn${isActive ? ' active' : ''}" onclick="filterTag('${t}')" role="tab">${t} <span class="count">${counts[t]}</span></button>`;
            });

            container.innerHTML = html;
        }

        function filterTag(tag) {
            activeTag = activeTag === tag ? null : tag;
            renderPosts();
            renderTagFilter();
        }

        function renderPosts() {
            const list = document.getElementById('posts');
            const empty = document.getElementById('empty');
            const posts = activeTag
                ? allPosts.filter(p => (p.tags || []).includes(activeTag))
                : allPosts;

            if (posts.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
                empty.textContent = allPosts.length === 0
                    ? 'No posts yet — check back soon.'
                    : 'No posts match that tag.';
                return;
            }

            empty.style.display = 'none';
            list.innerHTML = posts.map(p => `
                <a href="/fieldnotes/posts/${p.slug}.html" class="post-card">
                    <div class="post-card__head">
                        <span class="post-card__date">${formatDate(p.date)}</span>
                        <span class="post-card__readtime">${p.readtime || 1} min read</span>
                    </div>
                    <h2>${escHtml(p.title)}</h2>
                    <p class="post-card__summary">${escHtml(p.summary)}</p>
                    <div class="post-card__foot">
                        <div class="post-card__tags">
                            ${(p.tags || []).map(t => `<span class="post-tag">${escHtml(t)}</span>`).join('')}
                        </div>
                        <span class="post-card__arrow">read →</span>
                    </div>
                </a>
            `).join('');
        }

        function formatDate(iso) {
            if (!iso) return '';
            const d = new Date(iso + 'T00:00:00');
            return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        loadPosts();
    </script>

</body>

</html>
